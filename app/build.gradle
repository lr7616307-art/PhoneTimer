plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.phonetimer'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.phonetimer"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Fixed key, so every new version installs over the old one without uninstalling.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
